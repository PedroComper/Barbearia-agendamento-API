spring.application.name=main

# Credenciais locais (arquivo fora do Git). Variáveis de ambiente têm prioridade sobre ele.
spring.config.import=optional:classpath:secrets.properties

# Conexão com o SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=db_agendamento;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# O Hibernate vai criar e atualizar as tabelas automaticamente baseado no seu código Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
