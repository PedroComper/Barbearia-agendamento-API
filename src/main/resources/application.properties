spring.application.name=barbearia-api

# Credenciais locais (arquivo fora do Git). Variáveis de ambiente têm prioridade sobre ele.
spring.config.import=optional:classpath:secrets.properties

# Conexão com o SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=db_agendamento;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# O schema do banco é criado e evoluído pelo Flyway (src/main/resources/db/migration).
# O Hibernate apenas confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
